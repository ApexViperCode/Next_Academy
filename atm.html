    const cppText = `#include <iostream>
using namespace std;
#define green "[32m"
void shownunye()
{
    cout<<green;
    cout <<"********Menu**********"<<endl;
    cout <<"1.See The Palance: "<<endl;
    cout <<"2.Deposit: "<<endl;
    cout <<"3.Withdrawa: "<<endl;
    cout <<"4.Exit: "<<endl;


}

int main()
{ 
     int ch=0,a,b,planes=1000;
     
     while(ch !=4){
        shownunye();
        cin>>ch;
    switch(ch){
     case 1:cout<<planes<<endl;
     break;
     case 2:cout <<"Deposit.....";
     cin>>a;
     planes+=a;
     cout <<planes<<endl;
     break;
     case 3:cout <<"Withdrawal....";
     cin>>b;
     
     if(b>planes)
     {
        cout <<"There is no enough money."<<endl;
        break;
     }
     planes-=b;
     cout <<planes<<endl;

    }
}
  return 0;
}`;
